# Copies of the demo's telemetry for the airdeall pipeline, in pipelines of their own.
# scripts/apply_demo_extras.sh copies this file to src/otel-collector/ in the demo checkout.
# AI assisted in this config generation
exporters:
  kafka/pipeline:
    brokers: [pipeline-kafka:9092]
    traces:  {topic: otel.spans,   encoding: otlp_json}
    metrics: {topic: otel.metrics, encoding: otlp_json}
    logs:    {topic: otel.logs,    encoding: otlp_json}
    partition_traces_by_id: true
    producer: {compression: zstd, max_message_bytes: 8000000}
processors:
  probabilistic_sampler/pipeline:
    sampling_percentage: 25
service:
  pipelines:
    traces/pipeline:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, transform/sanitize_spans, gen_ai_normalizer,
                   transform/redact_sensitive_data, redaction, probabilistic_sampler/pipeline]
      exporters: [kafka/pipeline]
    metrics/pipeline:
      receivers: [otlp, docker_stats, host_metrics, span_metrics]
      processors: [memory_limiter, resource_detection]
      exporters: [kafka/pipeline]
    logs/pipeline:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, transform/sanitize_logs]
      exporters: [kafka/pipeline]