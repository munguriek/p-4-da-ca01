name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
    types: [closed]
  
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint and unit tests (Python ${{ matrix.python-version }})
    runs-on: Ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: |
          python -m pip install pip==26.3
          python -m pip install -e ".[dev]"
      
      - name: Lint
        run: ruff check .

      - name: Check formating
        run: ruff format --check .

      - name: Check airdeall command runs 
        run: airdeall --help

      - name: Run unit tests 
        if: hashFiles('tests/**/test_*.py') != '' # Skip until tests are written
        run: pytest -m "not integration"