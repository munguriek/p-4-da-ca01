# RouteWatch stack: Kafka and PostgreSQL on a project-scoped network.
name: airdeall-routewatch

services:
  routewatch-kafka:
    image: apache/kafka:4.4.0
    ports:
      - "127.0.0.1:39092:39092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:39092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://routewatch-kafka:9092,EXTERNAL://127.0.0.1:39092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@routewatch-kafka:9093
      CLUSTER_ID: ${ROUTEWATCH_KAFKA_CLUSTER_ID:?set ROUTEWATCH_KAFKA_CLUSTER_ID in .env}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_MESSAGE_MAX_BYTES: 8388608
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx256m /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 30s
    networks:
      - routewatch

  routewatch-db:
    image: postgres:18.6
    command: ["postgres", "-c", "default_toast_compression=lz4"]
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: routewatch
      POSTGRES_USER: routewatch
      POSTGRES_PASSWORD: ${ROUTEWATCH_POSTGRES_PASSWORD:?set ROUTEWATCH_POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "routewatch", "-d", "routewatch"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - routewatch

networks:
  routewatch: {}

volumes:
  kafka-data:
  db-data: